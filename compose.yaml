name: cloud-notes-lab08

services:
  web:
    build:
      context: .
      target: web
    init: true
    environment:
      LOCAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${LAB08_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
    networks: [edge, backend]

  api:
    # The application and database schema come from the same Lab 06 revision.
    build: https://github.com/SeedFlora/meet6CloudService.git#c0aed24cdfdc6894af640ca116ad70c8ce7a35af:api
    environment:
      APP_ENV: classroom
      DB_HOST: db
      DB_NAME: cloudnotes
      DB_USER: clouduser
      DB_PASSWORD: ${LAB08_DB_PASSWORD:-local-lab08-only}
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  db:
    build:
      context: .
      target: database
      additional_contexts:
        lab06: https://github.com/SeedFlora/meet6CloudService.git#c0aed24cdfdc6894af640ca116ad70c8ce7a35af
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: ${LAB08_DB_PASSWORD:-local-lab08-only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [backend]

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [backend]

  prometheus-lab08:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${LAB08_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    security_opt:
      - no-new-privileges:true
    networks: [edge]

  grafana-lab08:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cloud-notes-metrics.json
    ports:
      - "127.0.0.1:${LAB08_GRAFANA_PORT:-3301}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus-lab08:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
    security_opt:
      - no-new-privileges:true
    networks: [edge]

networks:
  edge:
  backend:
    internal: true

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
